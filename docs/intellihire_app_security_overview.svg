<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">IntelliHire Application Overview</title>
  <desc id="desc">Reference-style architecture and security overview for the IntelliHire PHP MVC recruitment app, with subtle contribution attribution.</desc>
  <defs>
    <style>
      .page { fill: #fbfaf7; }
      .title { font: 800 31px Arial, sans-serif; fill: #132033; }
      .sub { font: 600 13px Arial, sans-serif; fill: #5b6777; }
      .zone { fill: #fffefd; stroke: #76b8d7; stroke-width: 2; rx: 8; }
      .zone-label { font: 700 16px Arial, sans-serif; fill: #1f80aa; }
      .panel { fill: #f8fbfd; stroke: #72afd0; stroke-width: 1.5; rx: 7; }
      .panel-strong { fill: #ffffff; stroke: #2f94bd; stroke-width: 1.8; rx: 7; }
      .data { fill: #f7fff8; stroke: #62b779; stroke-width: 1.8; rx: 7; }
      .ext { fill: #fffaf0; stroke: #e0aa36; stroke-width: 1.5; rx: 7; }
      .risk { fill: #ffb4c0; stroke: #f06a81; stroke-width: 1.3; rx: 7; }
      .safe { fill: #eaf8ff; stroke: #5bb0cf; stroke-width: 1.5; rx: 7; }
      .text { font: 600 12px Arial, sans-serif; fill: #26384c; }
      .small { font: 600 10.5px Arial, sans-serif; fill: #4f5d6c; }
      .tiny { font: 600 9.5px Arial, sans-serif; fill: #5f6b78; }
      .bold { font: 800 12px Arial, sans-serif; fill: #17283b; }
      .risk-title { font: 800 11.5px Arial, sans-serif; fill: #6b2330; }
      .risk-text { font: 600 10.5px Arial, sans-serif; fill: #6b2330; }
      .line { stroke: #26384c; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #708093; stroke-width: 1.7; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow2); }
      .risk-line { stroke: #ef5b78; stroke-width: 2; fill: none; marker-end: url(#arrowRisk); }
      .ext-line { stroke: #d39a25; stroke-width: 1.7; stroke-dasharray: 5 5; fill: none; marker-end: url(#arrowExt); }
      .icon { stroke: #1d3045; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .chip { fill: #e9f6fb; stroke: #81bbd4; stroke-width: 1; rx: 12; }
      .chip-text { font: 700 9.5px Arial, sans-serif; fill: #236f8e; }
      .credit { fill: #ffffff; stroke: #cfdce8; stroke-width: 1.2; rx: 7; }
      .dot-dina { fill: #dff4fb; stroke: #5aaacc; stroke-width: 1; }
      .dot-nizar { fill: #efe8fb; stroke: #8d73c9; stroke-width: 1; }
      .credit-name { font: 800 10.5px Arial, sans-serif; fill: #203047; }
      .credit-text { font: 600 10px Arial, sans-serif; fill: #526170; }
      .shadow { filter: url(#shadow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#26384c"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#708093"/>
    </marker>
    <marker id="arrowRisk" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#ef5b78"/>
    </marker>
    <marker id="arrowExt" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#d39a25"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1b3148" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect class="page" width="1100" height="720"/>

  <text class="title" x="30" y="45">IntelliHire</text>
  <text class="title" x="30" y="78" style="font-size:29px">Application Overview</text>
  <text class="sub" x="31" y="102">Actual PHP MVC recruitment app: users, public entry point, controllers, services, data, external integrations and security controls.</text>

  <!-- Key -->
  <g transform="translate(32 128)">
    <rect class="panel" width="178" height="105"/>
    <text class="bold" x="13" y="25">Key</text>
    <line class="line" x1="15" y1="45" x2="60" y2="45"/>
    <text class="tiny" x="75" y="49">HTTP / app data</text>
    <line class="dash" x1="15" y1="67" x2="60" y2="67"/>
    <text class="tiny" x="75" y="71">Session / internal call</text>
    <line class="risk-line" x1="15" y1="89" x2="60" y2="89"/>
    <text class="tiny" x="75" y="93">Risk surface</text>
  </g>

  <!-- Risk callouts around left/top -->
  <g transform="translate(222 82)">
    <rect class="risk" width="162" height="56"/>
    <text class="risk-title" x="12" y="20">CSRF surface</text>
    <text class="risk-text" x="12" y="39">POST forms require</text>
    <text class="risk-text" x="12" y="52">session token checks.</text>
  </g>

  <g transform="translate(460 28)">
    <rect class="risk" width="170" height="64"/>
    <text class="risk-title" x="12" y="22">Direct entry point</text>
    <text class="risk-text" x="12" y="42">All requests pass through</text>
    <text class="risk-text" x="12" y="56">public/index.php.</text>
  </g>

  <g transform="translate(32 251)">
    <rect class="risk" width="158" height="64"/>
    <text class="risk-title" x="12" y="22">Credential / session</text>
    <text class="risk-text" x="12" y="43">Role checks reduce</text>
    <text class="risk-text" x="12" y="57">unauthorized access.</text>
  </g>

  <!-- User environment -->
  <g class="shadow">
    <rect class="zone" x="32" y="345" width="235" height="250"/>
  </g>
  <text class="zone-label" x="92" y="337">User environment</text>

  <g transform="translate(60 378)">
    <rect class="panel-strong" width="178" height="78"/>
    <text class="bold" x="72" y="23">Browser</text>
    <circle class="icon" cx="40" cy="48" r="14"/>
    <path class="icon" d="M25 69c5-16 25-16 30 0"/>
    <rect class="icon" x="106" y="38" width="38" height="25" rx="2"/>
    <line class="icon" x1="113" y1="68" x2="139" y2="68"/>
    <text class="tiny" x="61" y="48">Recruiter</text>
    <text class="tiny" x="61" y="62">Candidate</text>
  </g>

  <g transform="translate(60 476)">
    <rect class="panel" width="178" height="110"/>
    <text class="bold" x="18" y="25">Client-side UI</text>
    <text class="small" x="18" y="49">- PHP-rendered pages</text>
    <text class="small" x="18" y="68">- Vue notifications</text>
    <text class="small" x="18" y="87">- Ajax filters</text>
    <text class="small" x="18" y="106">- Chart.js dashboard</text>
  </g>

  <!-- Public web environment -->
  <g class="shadow">
    <rect class="zone" x="332" y="151" width="230" height="494"/>
  </g>
  <text class="zone-label" x="368" y="143">Public web environment</text>

  <g transform="translate(363 182)">
    <rect class="panel-strong" width="166" height="80"/>
    <text class="bold" x="22" y="26">WAMP / Apache</text>
    <text class="small" x="22" y="50">Single entry point</text>
    <text class="small" x="22" y="68">public/index.php</text>
  </g>

  <g transform="translate(363 294)">
    <rect class="panel" width="166" height="104"/>
    <text class="bold" x="22" y="25">Static assets</text>
    <text class="small" x="22" y="50">style.css</text>
    <text class="small" x="22" y="69">main.js</text>
    <text class="small" x="22" y="88">vue-islands.js</text>
  </g>

  <g transform="translate(363 430)">
    <rect class="panel" width="166" height="104"/>
    <text class="bold" x="22" y="25">Uploads</text>
    <text class="small" x="22" y="50">CV files in</text>
    <text class="small" x="22" y="69">public/uploads</text>
    <text class="tiny" x="22" y="90">PDF / DOC / DOCX checks</text>
  </g>

  <g transform="translate(300 571)">
    <rect class="risk" width="198" height="64"/>
    <text class="risk-title" x="13" y="22">Upload exposure</text>
    <text class="risk-text" x="13" y="43">CVs are public files;</text>
    <text class="risk-text" x="13" y="57">validate type, size, access.</text>
  </g>

  <!-- Application environment -->
  <g class="shadow">
    <rect class="zone" x="622" y="127" width="337" height="498"/>
  </g>
  <text class="zone-label" x="710" y="119">Application environment</text>

  <g transform="translate(655 151)">
    <rect class="panel-strong" width="255" height="82"/>
    <text class="bold" x="20" y="27">Core router and guards</text>
    <text class="small" x="20" y="51">App.php dispatches routes</text>
    <text class="small" x="20" y="70">Auth.php roles + Csrf.php tokens</text>
  </g>

  <g transform="translate(660 240)">
    <rect class="chip" width="73" height="22"/>
    <text class="chip-text" x="12" y="14">CSRF tokens</text>
    <rect class="chip" x="83" width="74" height="22"/>
    <text class="chip-text" x="96" y="14">Role checks</text>
    <rect class="chip" x="167" width="76" height="22"/>
    <text class="chip-text" x="181" y="14">Sessions</text>
  </g>

  <g transform="translate(655 271)">
    <rect class="panel" width="255" height="97"/>
    <text class="bold" x="20" y="27">Controllers</text>
    <text class="small" x="20" y="51">Auth, Dashboard, Offre</text>
    <text class="small" x="20" y="70">Candidature, Entretien</text>
    <text class="small" x="20" y="89">Ajax, AI summary endpoints</text>
  </g>

  <g transform="translate(655 400)">
    <rect class="panel" width="255" height="104"/>
    <text class="bold" x="20" y="27">Services</text>
    <text class="small" x="20" y="51">Matching score and workflow rules</text>
    <text class="small" x="20" y="70">Notifications and mail fallback</text>
    <text class="small" x="20" y="89">Local CV parser / AI insights</text>
  </g>

  <g transform="translate(665 511)">
    <rect class="chip" width="112" height="22"/>
    <text class="chip-text" x="13" y="14">Upload validation</text>
    <rect class="chip" x="122" width="112" height="22"/>
    <text class="chip-text" x="136" y="14">Local AI helper</text>
  </g>

  <g transform="translate(655 548)">
    <rect class="data" width="255" height="64"/>
    <text class="bold" x="20" y="25">Models + PDO</text>
    <text class="small" x="20" y="47">Prepared statements + FK-backed data</text>
  </g>

  <!-- Security controls -->
  <g transform="translate(845 34)">
    <rect class="safe" width="210" height="56"/>
    <path class="icon" d="M24 14l12 5v15c0 10-6 16-12 20-6-4-12-10-12-20V19z"/>
    <text class="bold" x="58" y="23">Security controls</text>
    <text class="tiny" x="58" y="41">CSRF, role checks, PDO, uploads</text>
  </g>

  <!-- External dependencies -->
  <g class="shadow">
    <rect class="zone" x="975" y="151" width="95" height="298"/>
  </g>
  <text class="zone-label" x="967" y="143">External deps</text>

  <g transform="translate(994 176)">
    <rect class="ext" width="58" height="62"/>
    <text class="bold" x="12" y="21" style="font-size:10px">CDN</text>
    <text class="tiny" x="12" y="40">Chart.js</text>
    <text class="tiny" x="12" y="54">Fonts</text>
  </g>

  <g transform="translate(994 274)">
    <rect class="ext" width="58" height="66"/>
    <text class="bold" x="9" y="21" style="font-size:10px">SMTP</text>
    <text class="tiny" x="9" y="40">PHPMailer</text>
    <text class="tiny" x="9" y="54">optional</text>
  </g>

  <g transform="translate(994 376)">
    <rect class="ext" width="58" height="58"/>
    <text class="bold" x="9" y="21" style="font-size:10px">Fallback</text>
    <text class="tiny" x="9" y="42">mail.log</text>
  </g>

  <g transform="translate(952 484)">
    <rect class="risk" width="112" height="72"/>
    <text class="risk-title" x="10" y="22">CDN availability</text>
    <text class="risk-text" x="10" y="43">Charts/fonts need</text>
    <text class="risk-text" x="10" y="57">internet access.</text>
  </g>

  <!-- Database -->
  <g class="shadow">
    <rect class="zone" x="640" y="650" width="430" height="46"/>
  </g>
  <text class="zone-label" x="793" y="642">Database</text>
  <g transform="translate(665 663)">
    <rect class="data" width="380" height="20"/>
    <text class="tiny" x="12" y="14">MySQL: users, roles, offers, applications, interviews, notifications, skills, history</text>
  </g>

  <g transform="translate(885 566)">
    <rect class="risk" width="140" height="64"/>
    <text class="risk-title" x="12" y="22">Demo data issue</text>
    <text class="risk-text" x="12" y="43">cv_demo paths can</text>
    <text class="risk-text" x="12" y="57">point to missing files.</text>
  </g>

  <g transform="translate(735 608)">
    <rect class="chip" width="104" height="22"/>
    <text class="chip-text" x="13" y="14">Prepared SQL</text>
    <rect class="chip" x="112" width="96" height="22"/>
    <text class="chip-text" x="128" y="14">FK constraints</text>
  </g>

  <!-- Contribution note: intentionally quiet -->
  <g transform="translate(32 665)">
    <rect class="credit" width="470" height="42"/>
    <circle class="dot-dina" cx="18" cy="15" r="5"/>
    <text class="credit-name" x="32" y="19">EL MEAAMMAR Dina</text>
    <text class="credit-text" x="155" y="19">backend package from ZIP: offers, interviews, models, config, schema</text>
    <circle class="dot-nizar" cx="18" cy="32" r="5"/>
    <text class="credit-name" x="32" y="36">NEGAGZA Nizar</text>
    <text class="credit-text" x="155" y="36">UI/UX, integration, security, docs and deployment</text>
  </g>

  <!-- Main flows -->
  <path class="line" d="M238 416 C290 410 295 235 363 222"/>
  <text class="tiny" x="256" y="375">GET / POST</text>
  <path class="dash" d="M238 520 C300 516 305 346 363 344"/>
  <text class="tiny" x="286" y="477">assets</text>
  <path class="line" d="M529 222 C585 220 606 184 655 184"/>
  <path class="line" d="M783 233 L783 271"/>
  <path class="line" d="M783 368 L783 400"/>
  <path class="line" d="M783 504 L783 548"/>
  <path class="line" d="M783 612 C790 632 815 642 835 663"/>

  <path class="risk-line" d="M384 110 C410 130 421 158 421 182"/>
  <path class="risk-line" d="M383 571 C402 540 407 531 430 534"/>
  <path class="risk-line" d="M885 594 C858 608 832 620 800 650"/>
  <path class="risk-line" d="M999 484 C1001 464 1003 453 1009 434"/>

  <path class="ext-line" d="M910 320 C950 302 960 212 994 207"/>
  <path class="ext-line" d="M910 455 C950 432 958 310 994 307"/>
  <path class="ext-line" d="M910 474 C948 464 958 405 994 405"/>
</svg>
